name: Build

# Builds the Windows binaries and uploads them as a workflow artifact. A push to main also
# replaces this repository's rolling "latest" pre-release (no launcher.json, no auto-update).
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Caches the Rust crates and what cargo compiled, so only changes to the helper rebuild.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SpotifyHelper

      # CMake looks for the Windows import library in the cargo registry while configuring,
      # so the Spotify helper's crates have to be fetched first.
      - name: Fetch Spotify helper crates
        working-directory: SpotifyHelper
        run: cargo fetch --locked

      - name: Configure
        run: cmake --preset vs2022-x64

      # Only the shipped binaries: the probe executables and regression tests do not build on
      # the runner (unresolved externals, a C4456 warning that /WX makes an error), and they
      # are not needed for a game build.
      - name: Build
        run: >
          cmake --build --preset release --parallel 4 --target
          dingosdk_launcher dingosdk_runtime dingosdk_server dingosdk_emote_packer

      # The update scripts get this repository's name so they download from this fork.
      - name: Stage
        shell: bash
        run: |
          mkdir stage
          cp build/vs2022-x64/Release/{ReSkateLauncher.exe,ReSkate.dll,ReSkateServer.exe,ReSkateEmotePacker.exe} stage/
          for script in update-from-fork.sh update-from-fork.bat; do
            sed "s|@REPO@|$GITHUB_REPOSITORY|" "contrib/$script" > "stage/$script"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ReSkate-windows-x64
          if-no-files-found: error
          path: stage/*

      # A rolling pre-release, so the update scripts can download without a login token.
      - name: Publish the latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest stage/* --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Built from $GITHUB_SHA"
